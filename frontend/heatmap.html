    <!-- Leaflet.heat plugin -->
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <script>
        // ------------------------
        // INIT MAP
        // ------------------------
        const defaultCenter = [-8.4095, 115.1889]; // tengah Bali
        const defaultZoom = 10;
        const DETAIL_ZOOM_THRESHOLD = 12;          // batas zoom detail

        const map = L.map("heatmap-map", {
            zoomControl: false,
            attributionControl: false
        }).setView(defaultCenter, defaultZoom);

        // Add Zoom Control (Adjusted for Mobile Nav)
        L.control.zoom({
            position: 'bottomleft'
        }).addTo(map);

        // Adjust Zoom Control Position via CSS for Mobile
        const zoomControlContainer = document.querySelector('.leaflet-bottom.leaflet-left');
        if (zoomControlContainer) {
            zoomControlContainer.style.marginBottom = '80px'; // Space for bottom nav
            zoomControlContainer.classList.add('md:mb-0'); // Reset on desktop
        }

        L.tileLayer(
            "https://cartodb-basemaps-a.global.ssl.fastly.net/light_all/{z}/{x}/{y}.png",
            { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }
        ).addTo(map);

        let heatLayer = null;
        let markersLayer = L.layerGroup().addTo(map);

        // ------------------------
        // FILTER LOGIC
        // ------------------------

        function getSelectedClasses() {
            const boxes = document.querySelectorAll("input[type=checkbox][data-class]");
            const active = [];
            boxes.forEach((cb) => {
                if (cb.checked) active.push(cb.dataset.class);
            });
            return active;
        }

        function getSelectedStatus() {
            const activeBtn = document.querySelector(".btn-toggle.bg-white");
            if (!activeBtn) return "";
            return activeBtn.dataset.status || "";
        }

        // ------------------------
        // LOAD DATA & BIKIN LAYER
        // ------------------------

        async function loadHeatmap() {
            const classes = getSelectedClasses();
            const status = getSelectedStatus();

            const url = `${API_BASE}/api/issues`;
            console.log("Fetching:", url);

            try {
                const res = await fetch(url);
                const allData = await res.json();

                let points = allData.filter(p => {
                    const pClass = p.issue_class || p.class;
                    const pStatus = p.status;

                    const classMatch = classes.length === 0 || classes.includes(pClass);
                    const statusMatch = status === "" || pStatus === status;

                    return classMatch && statusMatch;
                });

                // Animate counter
                const totalEl = document.getElementById("total-points");
                let currentTotal = parseInt(totalEl.innerText);
                if (isNaN(currentTotal)) currentTotal = 0;

                let newTotal = points.length;
                if (isNaN(newTotal)) newTotal = 0;

                animateValue(totalEl, currentTotal, newTotal, 1000);

                // --- build heat data ---
                const heatData = points
                    .filter(p => ((p.latitude || p.lat) && (p.longitude || p.long || p.lon)))
                    .map((p) => {
                        const lat = p.latitude || p.lat;
                        const lon = p.longitude || p.long || p.lon;
                        const score = p.final_score || p.severity_score || p.score || 0;
                        const intensity = Math.max(score / 100, 0.2);
                        return [lat, lon, intensity];
                    });

                if (heatLayer) {
                    map.removeLayer(heatLayer);
                }
                if (heatData.length > 0) {
                    heatLayer = L.heatLayer(heatData, {
                        radius: 25,
                        blur: 20,
                        maxZoom: 16,
                        gradient: {
                            0.2: 'blue',
                            0.4: 'cyan',
                            0.6: 'lime',
                            0.8: 'yellow',
                            1.0: 'red'
                        }
                    }).addTo(map);
                } else {
                    heatLayer = null;
                }

                // --- build markers layer ---
                markersLayer.clearLayers();

                points.forEach((p) => {
                    const pClass = p.issue_class || p.class || "unknown";
                    const pId = p.id;
                    const pScore = p.final_score || p.severity_score || p.score || "-";
                    const pStatus = p.status || "OPEN";
                    const pLat = p.latitude || p.lat;
                    const pLon = p.longitude || p.long || p.lon;

                    if (!pLat || !pLon) return;

                    const colorClass =
                        pClass === "jalan_bolong"
                            ? "text-red-500"
                            : pClass === "genangan_air"
                                ? "text-sky-500"
                                : pClass === "sampah_liar"
                                    ? "text-orange-500"
                                    : "text-gray-700";

                    const iconHtml = `
                        <div class="relative group cursor-pointer transform transition-transform hover:scale-110 hover:z-50">
                            <div class="relative z-10 drop-shadow-md">
                                <i class="fas fa-map-marker-alt text-3xl ${colorClass} drop-shadow-sm"></i>
                                <div class="absolute top-1.5 left-1/2 -translate-x-1/2 w-2 h-2 bg-white rounded-full shadow-inner"></div>
                            </div>
                            <div class="absolute left-1/2 -translate-x-1/2 top-full mt-1 whitespace-nowrap z-20">
                                <div class="bg-white/95 backdrop-blur-sm border border-gray-200 px-2 py-1 rounded-lg shadow-lg flex flex-col items-center gap-0.5">
                                    <span class="text-[10px] font-bold text-gray-800 uppercase tracking-wide leading-none">${pClass.replace('_', ' ')}</span>
                                    <span class="text-[9px] font-mono text-gray-500 leading-none">#${pId}</span>
                                </div>
                                <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-white rotate-45 border-t border-l border-gray-200"></div>
                            </div>
                        </div>
                    `;

                    const customIcon = L.divIcon({
                        html: iconHtml,
                        className: '',
                        iconSize: [30, 42],
                        iconAnchor: [15, 42],
                        popupAnchor: [0, -45]
                    });

                    const marker = L.marker([pLat, pLon], { icon: customIcon });

                    const popupHtml = `
                        <div class="font-sans p-1 min-w-[150px]">
                            <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${pClass.replace('_', ' ')}</div>
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-sm font-bold text-gray-800">Skor: ${pScore}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full ${pStatus === 'OPEN' ? 'bg-red-100 text-red-600' : pStatus === 'PENDING' ? 'bg-yellow-100 text-yellow-600' : 'bg-green-100 text-green-600'} font-bold">${pStatus}</span>
                            </div>
                            <div class="text-[10px] text-gray-400">ID: #${pId}</div>
                            <div class="mt-2 text-[10px] text-primary font-bold cursor-pointer hover:underline" onclick="window.location.href='detail.html?id=${pId}'">Lihat Detail &rarr;</div>
                        </div>
                    `;

                    marker.bindPopup(popupHtml);
                    markersLayer.addLayer(marker);
                });

                updateLayerVisibility();

            } catch (err) {
                console.error("Gagal load heatmap:", err);
            }
        }

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // ------------------------
        // TOGGLE HEAT vs MARKER
        // ------------------------

        function updateLayerVisibility() {
            const z = map.getZoom();

            if (z < DETAIL_ZOOM_THRESHOLD) {
                if (heatLayer && !map.hasLayer(heatLayer)) map.addLayer(heatLayer);
                if (markersLayer && map.hasLayer(markersLayer)) map.removeLayer(markersLayer);
            } else {
                if (markersLayer && !map.hasLayer(markersLayer)) map.addLayer(markersLayer);
                if (heatLayer && map.hasLayer(heatLayer)) map.removeLayer(heatLayer);
            }
        }

        map.on("zoomend", updateLayerVisibility);

        // ------------------------
        // EVENT HANDLER
        // ------------------------

        document
            .querySelectorAll("input[type=checkbox][data-class]")
            .forEach((cb) => cb.addEventListener("change", loadHeatmap));

        document.querySelectorAll(".btn-toggle").forEach((btn) => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".btn-toggle").forEach((b) => {
                    b.classList.remove("bg-white", "text-primary", "shadow-sm");
                    b.classList.add("text-textSecondary", "hover:text-textDark");
                });

                btn.classList.remove("text-textSecondary", "hover:text-textDark");
                btn.classList.add("bg-white", "text-primary", "shadow-sm");

                loadHeatmap();
            });
        });

        document.getElementById("btn-reset").addEventListener("click", () => {
            document
                .querySelectorAll("input[type=checkbox][data-class]")
                .forEach((cb) => (cb.checked = true));

            document.querySelectorAll(".btn-toggle").forEach((b) => {
                b.classList.remove("bg-white", "text-primary", "shadow-sm");
                b.classList.add("text-textSecondary");
            });
            const openBtn = document.getElementById("btn-status-open");
            openBtn.classList.add("bg-white", "text-primary", "shadow-sm");
            openBtn.classList.remove("text-textSecondary");

            loadHeatmap();
        });

        // ------------------------
        // SIDEBAR TOGGLE LOGIC
        // ------------------------
        const sidebarPanel = document.getElementById("sidebar-panel");
        const btnToggleSidebar = document.getElementById("btn-toggle-sidebar");
        const btnCloseSidebar = document.getElementById("btn-close-sidebar");
        const mobileBackdrop = document.getElementById("mobile-backdrop");

        function toggleSidebar() {
            const isHidden = sidebarPanel.classList.contains("opacity-0") || sidebarPanel.classList.contains("translate-y-full");

            if (isHidden) {
                sidebarPanel.classList.remove("md:opacity-0", "md:translate-y-10", "md:invisible");
                sidebarPanel.classList.remove("translate-y-full");

                mobileBackdrop.classList.remove("hidden");
                setTimeout(() => mobileBackdrop.classList.remove("opacity-0"), 10);

            } else {
                sidebarPanel.classList.add("md:opacity-0", "md:translate-y-10", "md:invisible");
                sidebarPanel.classList.add("translate-y-full");

                mobileBackdrop.classList.add("opacity-0");
                setTimeout(() => mobileBackdrop.classList.add("hidden"), 300);
            }
        }

        btnToggleSidebar.addEventListener("click", toggleSidebar);
        if (btnCloseSidebar) btnCloseSidebar.addEventListener("click", toggleSidebar);
        if (mobileBackdrop) mobileBackdrop.addEventListener("click", toggleSidebar);

        // ------------------------
        // INIT
        // ------------------------
        window.addEventListener("load", () => {
            setTimeout(() => {
                map.invalidateSize();
                loadHeatmap();
            }, 300);
        });

    </script>
</body>

</html>
